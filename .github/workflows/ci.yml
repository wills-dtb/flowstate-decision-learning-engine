name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m flowstate_equity.cli fixtures/work_events.csv --cross-function
        env:
          PYTHONPATH: src
      - name: Simple secret-pattern scan
        run: |
          ! grep -RInE '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' --exclude-dir=.git .

